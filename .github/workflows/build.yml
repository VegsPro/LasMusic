name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify keystore present
        run: |
          ls -la lasmusic-release.keystore
          keytool -list -keystore lasmusic-release.keystore -storepass 'LasMusic2026!' | head -5

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build.log | tail -80

      - name: Locate APKs
        run: find app/build/outputs -name "*.apk" -ls

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Checking $APK"
          jarsigner -verify -verbose -certs "$APK" 2>&1 | head -40
          # Fail if unsigned
          if ! jarsigner -verify "$APK" 2>&1 | grep -q "jar verified"; then
            echo "APK NOT SIGNED - signing manually"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore lasmusic-release.keystore \
              -storepass 'LasMusic2026!' \
              -keypass 'LasMusic2026!' \
              "$APK" lasmusic
            jarsigner -verify "$APK"
          fi
          echo "Signature OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LasMusic-1.3.0
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
